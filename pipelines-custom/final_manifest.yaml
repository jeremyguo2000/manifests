# Step 1: Delete existing secret if it exists
# kubectl delete secret minio-credentials -n kubeflow-user

---
# Step 2: Create the properly formatted secret
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: kubeflow-user
  # IMPORTANT: These annotations help KServe discover S3 settings
  annotations:
    serving.kserve.io/s3-endpoint: minio-service.kubeflow:9000  # NO http:// prefix
    serving.kserve.io/s3-usehttps: "0"  # Use HTTP, not HTTPS
    serving.kserve.io/s3-region: us-east-1
    serving.kserve.io/s3-useanoncredential: "false"  # Use credentials, not anonymous
type: Opaque
data:
  # These are the standard AWS credential keys that boto3/botocore expects
  AWS_ACCESS_KEY_ID: bWluaW8=      # echo -n "minio" | base64
  AWS_SECRET_ACCESS_KEY: bWluaW8xMjM=  # echo -n "minio123" | base64

---
# Step 3: Create/update the service account to use the secret
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: kubeflow-user
secrets:
- name: minio-credentials
---
# Step 4: Create RBAC to allow the service account to read secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: kubeflow-user
  name: secret-reader
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-secrets
  namespace: kubeflow-user
subjects:
- kind: ServiceAccount
  name: default
  namespace: kubeflow-user
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io