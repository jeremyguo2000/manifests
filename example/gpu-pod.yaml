apiVersion: v1
kind: Pod
metadata:
  name: gpu-pod
  namespace: kubeflow
spec:
  nodeSelector:
    nvidia.com/gpu: "true"  # This ensures the pod runs on GPU nodes
  containers:
  - name: cuda-container
    image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
    resources:
      limits:
        nvidia.com/gpu: 1  # Request one GPU
      requests:
        nvidia.com/gpu: 1  # Request one GPU
  initContainers:
  - name: istio-init
    image: docker.io/istio/proxyv2:1.24.2
  # Other container specifications...
