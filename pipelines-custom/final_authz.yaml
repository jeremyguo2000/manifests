apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: kserve-allow-all-models
  namespace: kubeflow-user
spec:
  rules:
  - from:
    - source:
        namespaces: ["kubeflow-user"]
  - to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE", "HEAD", "OPTIONS"]